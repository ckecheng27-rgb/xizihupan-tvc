<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#0a0a0a;color:#f0ede8;padding:40px 20px}
h1{font-size:28px;font-weight:200;letter-spacing:3px;margin-bottom:8px}
h1 strong{font-weight:400;color:#c9a84c}
.sub{font-size:12px;color:rgba(240,237,232,.3);letter-spacing:2px;margin-bottom:40px}
.section-card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.015);margin-bottom:20px;padding:20px 24px;border-radius:8px}
.section-card h2{font-size:14px;font-weight:300;letter-spacing:2px;color:#c9a84c;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:rgba(240,237,232,.4);letter-spacing:1px;margin-bottom:4px}
.field input,.field textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#f0ede8;padding:8px 12px;font-size:13px;border-radius:4px;outline:none;transition:border .2s}
.field input:focus,.field textarea:focus{border-color:#c9a84c}
.field textarea{resize:vertical;min-height:50px;font-family:inherit}
.field textarea.tall{min-height:120px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.btn-row{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{padding:10px 28px;border:none;border-radius:4px;font-size:13px;letter-spacing:1px;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-primary{background:#c9a84c;color:#0a0a0a;font-weight:500}
.btn-danger{background:#8b3a3a;color:#f0ede8}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.15);color:#f0ede8}
.toast{position:fixed;top:20px;right:20px;background:#1a1a1a;border:1px solid rgba(201,168,76,.3);padding:12px 24px;border-radius:6px;font-size:13px;color:#c9a84c;opacity:0;transition:opacity .4s;z-index:1000}
.toast.show{opacity:1}
.vid-preview{font-size:11px;color:rgba(240,237,232,.3);margin-top:4px}
.preview-link{color:#c9a84c;text-decoration:none;font-size:11px}
.preview-link:hover{text-decoration:underline}
.tabs{display:flex;gap:2px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:8px 18px;font-size:12px;border:1px solid rgba(255,255,255,.08);background:transparent;color:rgba(240,237,232,.4);cursor:pointer;border-radius:4px 4px 0 0;letter-spacing:1px}
.tab.active{background:rgba(201,168,76,.08);border-color:#c9a84c;color:#c9a84c}
.tab-panel{display:none}
.tab-panel.active{display:block}
.footer-note{margin-top:40px;font-size:11px;color:rgba(240,237,232,.2);text-align:center;letter-spacing:1px}

      <label>核心创意</label>
      <textarea id="case1_idea" class="tall">以"十惠鸭"IP串联品牌福利，通过山巅召唤、金色粒子特效等视觉语言，将品牌福利具象化。AIDA模型驱动：Attention（水墨山巅奇观）→ Interest（金色"惠"字符号）→ Desire（福利场景蒙太奇）→ Action（直播间入口引导）</textarea>
    </div>
    <div class="field">
      <label>分镜脚本（每行一个：时间|描述）</label>
      <textarea id="case1_shots" class="tall">0-4s|【开篇】大远景推镜，山峦层叠青绿山水，十惠鸭立于山巅。水墨质感，金色阳光穿透云缝。祥云飘动+金色粒子汇聚。空灵竹笛渐入。
5-9s|【推进】推镜至十惠鸭特写，瞳孔中倒映万千金色"惠"字符号。暖金色调流光溢彩。古筝急弦+铜铃声。
10-16s|【高潮】蒙太奇切换，十惠鸭振翅，金色"惠"字符号如浪潮涌向屏幕。画面分割为福利场景。粒子爆炸，交响乐渐强。
16-20s|【收尾】镜头回到十惠鸭张开翅膀，背后金色"惠"字展开，直播间界面浮现。金色粒子汇聚成"西子湖畔直播间"字样。</textarea>
    </div>

      <div class="field"><label>I - 激发兴趣</label><input type="text" id="case1_i" value="金色惠字符号与十惠鸭瞳孔中的倒影"></div>
    </div>
    <div class="row">

      <div class="field"><label>A - 促成行动</label><input type="text" id="case1_a2" value=""上十惠鸭，领福利"画外音引导"></div>

11-15s|【福利爆发】远景快速拉远，十惠鸭冲破白蛇肚皮，白蛇裂开化作万千红包从天而降。电子音乐+欢呼声。</textarea>

    <div class="field">
      <label>关键帧（每行一个：KF编号|描述）</label>

KF 2|【水墨穿越】十惠鸭从画卷中飞出，穿越水墨山水
KF 3|【江湖对峙】五毒（蛇/蝎/蜈蚣/壁虎/蟾蜍）现身，与十惠鸭对峙
KF 4|【眼神特写】十惠鸭眼神坚定，蓄势待发
KF 5|【红包亮相】十惠鸭振翅，金色红包如暗器四射
KF 6|【福运爆发】五毒退散，"端午安康"字样浮现，福利爆发</textarea>

    </div>
    <div class="field">
      <label>核心创意</label>
      <textarea id="case4_idea" class="tall">以"钓鱼"为创意核心，通过反差幽默制造记忆点。AIDA模型：Attention（西湖晨起钓鱼的宁静）→ Interest（"空军"的失落与水下巨龙的反转）→ Desire（红包打窝的视觉奇观）→ Action（"上十惠鸭"的社交裂变引导）</textarea>
    </div>
    <div class="field">
      <label>分镜脚本</label>
      <textarea id="case4_shots" class="tall">0-3s|【西湖晨起】全景，西湖晨曦，十惠鸭悠闲钓鱼。鸟鸣+轻音乐。
4-9s|【等待无果】中景，十惠鸭频频看浮漂，一无所获，表情失落。音效渐弱。
10-12s|【水下冷暴击】水下镜头，巨大阴影逼近，气泡翻涌。心跳声+低音轰鸣。
13-15s|【灵光乍现】特写，十惠鸭恍然大悟，拿出"福利红包"挂在鱼钩上。轻快音效。
16-19s|【红包打窝】中景，十惠鸭甩竿，红包入水，水面下金光炸裂。音乐渐强。
20-23s|【高潮爆发】远景+快速上升，水面炸开，无数红包从水下喷涌而出，十惠鸭站在红包堆上。交响乐高潮+笑声。</textarea>

function showToast(msg,ok=true){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.color=ok?'#c9a84c':'#e06060';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function showLogoPreview(id){
  const el=document.getElementById(id);
  const pre=document.getElementById(id+'_preview');
  if(!el||!pre)return;
  const v=el.value.trim();
  if(v){
    pre.innerHTML='<img src="'+v.replace(/"/g,'&quot;')+'" style="max-height:48px;max-width:200px;border-radius:4px;opacity:.85" onerror="this.parentNode.innerHTML=\'<span style=color:#e06060;font-size:11px>✕ 图片加载失败</span>\'">';
  }else{
    pre.innerHTML='';
  }
}

function loadConfig(){
  try{
    const d=JSON.parse(localStorage.getItem('xizitvc_config')||'{}');
    Object.keys(DEFAULTS).forEach(k=>{
      const el=document.getElementById(k);
      if(el&&d[k]!==undefined) el.value=d[k];
    });
    showLogoPreview('hero_logo');
    showLogoPreview('footer_logo');
  }catch(e){}
}

function saveConfig(){
  const cfg={};
  Object.keys(DEFAULTS).forEach(k=>{
    const el=document.getElementById(k);
    if(el) cfg[k]=el.value;
  });
  localStorage.setItem('xizitvc_config',JSON.stringify(cfg));
  showLogoPreview('hero_logo');
  showLogoPreview('footer_logo');
  showToast('✅ 配置已保存到浏览器！');
}

function exportConfig(){
  const cfg={};
  Object.keys(DEFAULTS).forEach(k=>{
    const el=document.getElementById(k);
    if(el) cfg[k]=el.value;
  });
  const blob=new Blob(['// 西子湖畔TVC后台配置\n// 将此文件放入项目根目录，index.html会自动读取\nconst XIZI_CONFIG='+JSON.stringify(cfg,null,2)+';'],{type:'text/javascript'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='_config.js';
  a.click();
  showToast('📤 已导出 _config.js，可部署到GitHub');
}

function resetConfig(){
  if(!confirm('恢复默认配置？当前修改会丢失。')) return;
  Object.keys(DEFAULTS).forEach(k=>{
    const el=document.getElementById(k);
    if(el) el.value=DEFAULTS[k];
  });
  localStorage.removeItem('xizitvc_config');
  showToast('↺ 已恢复默认配置');
}

// Tabs
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('panel-'+this.dataset.tab).classList.add('active');
  });
});

loadConfig();

document.getElementById('hero_logo')?.addEventListener('input',function(){showLogoPreview('hero_logo')});
document.getElementById('footer_logo')?.addEventListener('input',function(){showLogoPreview('footer_logo')});
